---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ansible:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ansible==14.5.0 ansible-lint==26.10.1 yamllint==1.38.0

      - name: Dummy vault password file (vault.yml is excluded from linting)
        run: echo "ci-dummy" > ~/.vault_pass

      - name: yamllint
        run: yamllint ansible .yamllint .ansible-lint .github

      - name: ansible-lint
        run: ansible-lint ansible/site.yml

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: init (no backend)
        run: terraform -chdir=terraform init -backend=false

      - name: validate
        run: terraform -chdir=terraform validate

  deploy:
    name: Deploy to production
    needs: [ansible, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible==14.5.0

      - name: Prepare SSH, vault password and inventory
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s' "$VAULT_PASSWORD" > ~/.vault_pass
          chmod 600 ~/.vault_pass
          printf '[web]\niac-web ansible_host=%s ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/deploy_key\n' "$DEPLOY_HOST" > ansible/inventory.ini

      - name: Deploy
        run: ansible-playbook ansible/site.yml
