---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - unzip
      - htop
      - ca-certificates
      - unattended-upgrades
    state: present

- name: Set timezone to Europe/Athens
  community.general.timezone:
    name: Europe/Athens
